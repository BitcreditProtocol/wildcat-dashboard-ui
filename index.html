<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Resolve the saved preference before styles or React can paint a light frame.
      (() => {
        let theme = "system";
        try {
          theme = localStorage.getItem("theme") ?? "system";
        } catch {}
        const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
      })();
    </script>
    <style>
      html { background: #fefbf1; color-scheme: light; }
      html.dark { background: #0b0600; color-scheme: dark; }
    </style>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/favicon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      type="image/png"
      sizes="192x192"
      href="/favicon-192x192.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Wildcat Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="/config.js"></script>
    <script
      type="module"
      src="/src/main.tsx"
    ></script>
  </body>
</html>

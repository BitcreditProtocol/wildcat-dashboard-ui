name: CI

on:
  push:
    branches: ["master", "dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (style, lint, test, build)
    timeout-minutes: 15
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code style
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests and generate coverage + JUnit report
        run: npm run test -- --run --coverage --reporter=default --reporter=junit --outputFile.junit=./coverage/junit.xml

      - name: Build
        run: npm run build

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/junit.xml
          report_type: test_results

  container:
    name: Validate container (build, nginx)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Node versions match
        run: test "$(cat .nvmrc)" = "$(sed -nE 's/^FROM node:([0-9]+).*/\1/p' Dockerfile)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          pull: true
          load: true
          push: false
          tags: wildcat-dashboard-ui:ci
          cache-from: type=gha,scope=dashboard-ci
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=dashboard-ci' || '' }}

      - name: Validate entrypoint and nginx configuration
        run: docker run --rm wildcat-dashboard-ui:ci nginx -t

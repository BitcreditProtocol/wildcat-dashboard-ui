name: CI

on:
  push:
    # Master pushes are validated once by deploy.yml before deployment.
    branches: ["dev"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip_coverage_upload:
        description: Skip Codecov uploads when revalidating manual or tag deployments
        type: boolean
        default: true
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate (style, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check code style
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Run tests and generate coverage + JUnit report
        run: npm run test -- --run --coverage --reporter=default --reporter=junit --outputFile.junit=./coverage/junit.xml

      - name: Build
        run: npm run build

      - name: Upload coverage to Codecov
        if: ${{ !inputs.skip_coverage_upload }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info

      - name: Upload test results to Codecov
        if: ${{ !inputs.skip_coverage_upload }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/junit.xml
          report_type: test_results

  container:
    name: Validate container (build, nginx, runtime config)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Check workflow gates
        run: python3 .github/scripts/test_workflows.py

      - name: Check smoke-test failure handling
        run: python3 .github/scripts/test_smoke_container.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build test image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          pull: true
          load: true
          push: false
          tags: wildcat-dashboard-ui:ci
          cache-from: type=gha,scope=dashboard-ci
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=dashboard-ci' || '' }}

      - name: Smoke-test nginx and runtime configuration
        run: python3 .github/scripts/smoke_container.py wildcat-dashboard-ui:ci

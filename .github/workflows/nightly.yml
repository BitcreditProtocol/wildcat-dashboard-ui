name: build and push nightly image

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    uses: ./.github/workflows/build-image.yml
    with:
      tags: type=raw,value=nightly

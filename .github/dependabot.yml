version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Vienna"
    target-branch: "dev"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Move to a new Node.js major only after it enters LTS and is validated.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
    assignees:
      - "JulianVIE"

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      all-github-actions:
        patterns:
          - "*"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Vienna"
    open-pull-requests-limit: 5
    target-branch: "dev"
    labels:
      - "dependencies"
      - "github-actions"
    cooldown:
      default-days: 3
    assignees:
      - "JulianVIE"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Europe/Vienna"
    labels:
      - "dependencies"
      - "npm"
    target-branch: "dev"
    open-pull-requests-limit: 7
    groups:
      npm:
        update-types:
          - "patch"
          - "minor"
      ## optional: group major updates
      #npm-major:
      #  update-types:
      #    - "major"
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    assignees:
      - "JulianVIE"
